<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Reg Form</title>
  </head>
  <body>
    <h1>Employee Registration Form</h1>
    <form action="welcome.html"  method="get"  target="_blank" novalidate autocomplete="off">
      <fieldset>
        <legend>Personal Information</legend>

        <label>Upload Profile Picture:</label>
        <input type="file" name="reg_file"/>
        <br />
        <br />

        <label>Full Name:</label>
        <input type="text" id="name" name="reg_name" pattern="[A-Za-z ]{3,50}"/>
        <br />
        <br />

        <label>Email:</label>
        <input type="email"  name="reg_email" pattern="[a-zA-Z]+\.{1}[0-9]{6}@marwadiuniversity\.ac\.in"/>
        <br />
        <br />

        <label>Password:</label>
        <input type="password" name="reg_password" pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*\d).{8,}"/>
        <br />
        <br />

        <label>Phone number:</label>
        <input type="tel" name="reg_phone"  pattern="[0-9]{10}"/>
        <br />
        <br />

        <label>Age:</label>
        <input type="number" name="reg_age"  pattern="[0-9]{2}"/>
        <br />
        <br />

        <label>Gender:</label>
        <input type="radio" name="reg_gender" value="Male"/><label>Male</label> 
        <input type="radio" name="reg_gender" value="Female"/><label>Female</label
        >
        <br />
        <br />

        <label>Address:</label>
        <input type="text" name="reg_address"/>
        <br />
        <br />
      </fieldset>

      <fieldset>
        <legend>Employment</legend>

        

        <label>Job Title:</label>
        <input type="text" name="reg_job_title"/>
        <br />
        <br />

        <label>Start Date:</label>
        <input type="date" name="reg_start_date"/>
        <br />
        <br />

        <label>Experience:</label>
        <input type="text" name="reg_exp"/>
        <br />
        <br />
        
        <label>Agree to Terms:</label>
        <input type="checkbox" name="reg_terms" value="I agree"/><label>I agree</label>
      </fieldset>

      <fieldset>
        <legend>Form Controls</legend>

        <input type="submit" />
        <br /><br />

        <input type="reset" />
        <br /><br />
      </fieldset>
    </form>
    <script>
      function sub()
      {

      }
    </script>
  </body>
</html>
